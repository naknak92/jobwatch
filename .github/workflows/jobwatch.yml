name: Veille offres data

on:
  schedule:
    # Lancement principal : cron-job.org appelle « Run workflow » toutes les 10 minutes.
    # Cette planification GitHub ne sert que de secours (GitHub en saute beaucoup).
    - cron: "7,37 * * * *"
  workflow_dispatch:          # bouton « Run workflow » pour lancer à la main

# un seul passage à la fois, pour ne pas envoyer deux fois la même offre
concurrency:
  group: jobwatch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python jobwatch.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # fourni automatiquement par GitHub
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FT_CLIENT_ID: ${{ secrets.FT_CLIENT_ID }}
          FT_CLIENT_SECRET: ${{ secrets.FT_CLIENT_SECRET }}
          PROFILE: ${{ secrets.PROFILE }}
      - name: Mémoriser les offres déjà vues
        run: |
          git config user.name "jobwatch-bot"
          git config user.email "actions@github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "seen: $(date -u +%FT%H:%M)" && git push
